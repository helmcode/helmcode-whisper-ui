name: ci

# Manual only, for now, and not because the tests are unreliable.
#
# This job checks out helmcode-whisper alongside, because the interface imports
# it. While that repo is private, the token GitHub hands a workflow cannot see
# it — a repository's GITHUB_TOKEN is scoped to that repository — and the
# checkout fails with "Not Found" on every push. A permanently red CI teaches
# people to ignore CI, so it waits here instead.
#
# To turn it on, either:
#   - make both repositories public, and delete this comment along with the
#     `workflow_dispatch` line below, restoring push and pull_request; or
#   - add a token with read access to helmcode-whisper as the repository secret
#     HELMCODE_WHISPER_TOKEN, which the checkout step already looks for.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Same pairs the tool itself is gated on. The interface imports the
        # package, so a break in either direction should show up here.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Check out helmcode-whisper next to it
        uses: actions/checkout@v5
        with:
          repository: helmcode/helmcode-whisper
          path: helmcode-whisper
          token: ${{ secrets.HELMCODE_WHISPER_TOKEN || github.token }}

      - name: Install ffmpeg and PortAudio (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libportaudio2

      - uses: astral-sh/setup-uv@v6

      # The interface has no dependencies of its own — standard library plus the
      # package — so this installs the package and pytest and nothing else.
      - name: Install
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ./helmcode-whisper
          uv pip install pytest ruff

      - name: Lint
        run: uv run ruff check .

      # No test here opens a socket, an audio device or the network: they cover
      # path resolution, the space registry, the notes editor and the iCalendar
      # subset. Anything needing a real device is run by hand.
      - name: Test
        run: uv run pytest -q
